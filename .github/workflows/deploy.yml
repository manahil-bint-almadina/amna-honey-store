name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/og-share.jpg
          grep -Fq './assets/' dist/index.html
          ! grep -Fq '/src/main.tsx' dist/index.html
          SITE_URL="${{ steps.pages.outputs.base_url }}"
          SITE_URL="${SITE_URL%/}"
          if [ -n "$SITE_URL" ]; then
            node -e "const fs=require('fs');const u=process.argv[1];let h=fs.readFileSync('dist/index.html','utf8');h=h.replace('<!-- canonical-link -->','<link rel=\"canonical\" href=\"'+u+'/\" />').replaceAll('./og-share.jpg',u+'/og-share.jpg').replaceAll('./apple-touch-icon.png',u+'/apple-touch-icon.png').replaceAll('./favicon.png',u+'/favicon.png').replace('property=\"og:url\" content=\"./\"','property=\"og:url\" content=\"'+u+'/\"');fs.writeFileSync('dist/index.html',h);" "$SITE_URL"
          fi
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
